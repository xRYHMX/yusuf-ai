<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Günün Sürpriz Kuponu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
    <div class="coupons-layout">
        <!-- Üst Bar: Başlık, Yenile Butonu ve Tema Değiştirici -->
        <header class="coupons-header">
            <div class="header-brand">
                <span class="brand-title">Günün Sürpriz Kuponu</span>
            </div>
            <div class="header-actions">
                <button type="button" id="refreshCouponsBtn" class="btn-refresh" title="Kuponu ve Anlık Verileri Yenile">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6"></path>
                        <path d="M1 20v-6h6"></path>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span>Yenile</span>
                </button>
                <button type="button" id="themeToggleBtn" class="theme-toggle-btn" title="Temayı Değiştir">
                    <span id="themeIcon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
                    <span id="themeBtnText">Karanlık</span>
                </button>
            </div>
        </header>

        <!-- Ana İçerik: Sadece Sürpriz Kupon, Maçlar ve Anlık Veriler -->
        <main class="coupons-main">
            <!-- Nesine Canlı Oran Senkronizasyon Durum Çubuğu -->
            <div id="nesineLiveStatusBar" class="nesine-status-bar" style="display: none;"></div>

            <!-- Yükleniyor Durumu -->
            <div id="couponsLoading" class="panel-loading">
                <div class="spinner"></div>
                <span>Sürpriz maçlar ve anlık veriler yükleniyor...</span>
            </div>

            <!-- Kupon Alanı -->
            <div id="couponsContent" class="coupons-cards-grid" style="display: none;">
                <!-- Sürpriz Kuponu Kartı -->
                <div class="coupon-card surprise-card">
                    <div class="coupon-card-header">
                        <div class="coupon-badge-title">
                            <span class="badge-icon">🎯</span>
                            <h3 id="surpriseTitle">Sürpriz Kupon</h3>
                        </div>
                    </div>
                    <div class="coupon-matches-list" id="surpriseMatchesList"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
